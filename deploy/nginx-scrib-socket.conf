# Public real-time channel used by the SCRIB clients hosted at scribshow.es.
# The dedicated SSH tunnel keeps the Node process bound to the backend loopback.
location ^~ /socket.io/ {
    access_log /var/log/nginx/sutura_services_access.log sutura_activity;
    auth_request /_wake/check;
    error_page 401 = @wake_backend;
    error_page 502 503 504 = @wake_backend;
    proxy_pass https://127.0.0.1:13000/socket.io/;
    proxy_http_version 1.1;
    proxy_ssl_verify off;
    proxy_redirect off;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host sutura.ddns.net;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_intercept_errors on;
    proxy_connect_timeout 6s;
    proxy_send_timeout 90s;
    proxy_read_timeout 300s;
}
